<div class="login-container" [style.backgroundColor]="currentTheme.background">
  <mat-card class="login-card" [style.backgroundColor]="currentTheme.card">
    <mat-card-header>
      <mat-card-title>Register</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <form (ngSubmit)="onRegister()">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Handle</mat-label>
          <input matInput [(ngModel)]="handle" name="handle" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Display Name</mat-label>
          <input matInput [(ngModel)]="displayName" name="displayName" required>
        </mat-form-field>
        
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" required>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required>
        </mat-form-field>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <button mat-raised-button color="primary" class="full-width" type="submit">
          Register
        </button>
      </form>
    </mat-card-content>
    
    <mat-card-actions>
      <button mat-button (click)="onLogin()">Already have an account? Log In</button>
    </mat-card-actions>
  </mat-card>
</div>
