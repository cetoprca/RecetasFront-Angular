<div class="login-container" [style.backgroundColor]="currentTheme.background">
  <mat-card class="login-card" [style.backgroundColor]="currentTheme.card">
    <mat-card-header>
      <mat-card-title>{{ 'AUTH.LOGIN.TITLE' | translate }}</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <form (ngSubmit)="onLogin()">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>{{ 'AUTH.LOGIN.HANDLE_LABEL' | translate }}</mat-label>
          <input matInput [(ngModel)]="handle" name="handle" required>
        </mat-form-field>
        
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>{{ 'AUTH.LOGIN.PASSWORD_LABEL' | translate }}</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" required>
        </mat-form-field>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <button mat-raised-button color="primary" class="full-width" type="submit">
          {{ 'AUTH.LOGIN.SUBMIT' | translate }}
        </button>
      </form>
    </mat-card-content>
    
    <mat-card-actions>
      <button mat-button (click)="onRegister()">{{ 'AUTH.LOGIN.REGISTER_LINK' | translate }}</button>
    </mat-card-actions>
  </mat-card>
</div>
