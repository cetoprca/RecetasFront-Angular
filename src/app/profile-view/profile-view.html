<app-recipe-scroll
  [recipes]="recipes"
  [hasMore]="hasMore"
  [loading]="loading"
  (loadMore)="onLoadMore()"
>
  <app-profile-header
    slot="header"
    [username]="username"
    [userHandle]="userHandle"
    [bio]="bio"
    [profilePicture]="profilePicture"
    [followers]="followers"
    [following]="following"
    [recipesCount]="recipesCount"
    [isOwnProfile]="isOwnProfile"
  />
</app-recipe-scroll>
