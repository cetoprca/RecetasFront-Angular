<div [attr.data-theme]="currentTheme.value" class="app-container">
  <header [style.backgroundColor]="currentTheme.header" [style.color]="currentTheme.text">
    <span>Rataouille.net</span>
    <div class="header-buttons">
      @if (isAuthenticated$ | async) {
        <button (click)="logout()">Cerrar sesión</button>
      } @else {
        <button (click)="navigateToLogin()">Iniciar sesión</button>
      }
    </div>
  </header>
  <div class="main-content">
    <router-outlet></router-outlet>
  </div>
</div>
